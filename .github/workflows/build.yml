name: Build iOS-Dumper-7

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('Dumper.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build dylib (no signing)
        run: |
          xcodebuild \
            -project Dumper.xcodeproj \
            -scheme Dumper \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            BUILD_DIR="$GITHUB_WORKSPACE/build" \
            | xcpretty

      - name: Upload Dumper.dylib
        uses: actions/upload-artifact@v4
        with:
          name: Dumper-dylib
          path: build/**/*.dylib
          if-no-files-found: error
          retention-days: 30

